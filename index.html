<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Replacement Simulator</title>
    <meta name="description"
        content="Simulate page replacement algorithms: FIFO, LRU, Optimal. Minimalist visualization.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header>
            <h1>Page Replacement Simulator</h1>
            <p>A Simulator for memory frame management.</p>
        </header>

        <main>
            <section class="card input-card">
                <div class="input-grid">
                    <div class="form-group full-width">
                        <div
                            style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                            <label for="reference-string" style="margin-bottom: 0;">Reference String</label>
                            <button type="button" id="example-btn" class="secondary"
                                style="padding: 4px 12px; font-size: 0.75rem; flex: none;">Load Example</button>
                        </div>
                        <input type="text" id="reference-string" value="">
                        <span class="hint">Use commas or spaces to separate pages.</span>
                    </div>

                    <div class="form-group half-width">
                        <label for="frames">Frames</label>
                        <input type="number" id="frames" min="1" max="10" value="3">
                    </div>

                    <div class="form-group half-width">
                        <label for="algorithm">Algorithm</label>
                        <div class="select-wrapper">
                            <select id="algorithm">
                                <option value="FIFO">FIFO</option>
                                <option value="LRU">LRU</option>
                                <option value="OPTIMAL">Optimal</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="actions">
                    <button id="simulate-btn">Simulate Execution</button>
                    <button id="reset-btn" class="secondary">Reset</button>
                </div>
            </section>

            <section class="card output-card" id="output-section" style="display: none;">
                <div class="results-header">
                    <h2>Simulation Results</h2>
                    <div class="metrics">
                        <div class="metric-box">
                            <span class="metric-label">Faults</span>
                            <span class="metric-value fault-text" id="faults-metric">0</span>
                        </div>
                        <div class="metric-box">
                            <span class="metric-label">Hits</span>
                            <span class="metric-value hit-text" id="hits-metric">0</span>
                        </div>
                        <div class="metric-box">
                            <span class="metric-label">Hit Ratio</span>
                            <span class="metric-value" id="hit-ratio-metric">0%</span>
                        </div>
                    </div>
                </div>

                <div class="table-wrapper">
                    <table id="simulation-table">
                        <thead>
                            <tr id="table-header"></tr>
                        </thead>
                        <tbody id="table-body">
                        </tbody>
                    </table>
                </div>

                <div class="legend">
                    <div class="legend-item">
                        <div class="box hit-box"></div> <span>Page Hit</span>
                    </div>
                    <div class="legend-item">
                        <div class="box fault-box"></div> <span>Page Fault</span>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>

</html>
